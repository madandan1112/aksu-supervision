server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    max-http-form-post-size: 200MB
    max-swallow-size: 200MB

spring:
  application:
    name: aksu-supervision-backend
  datasource:
    url: jdbc:mysql://localhost:3306/aksu_supervision?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  # Redis disabled for now
  # data:
  #   redis:
  #     host: localhost
  #     port: 6379
  #     database: 0
  #     timeout: 5000ms
  #     lettuce:
  #       pool:
  #         max-active: 20
  #         max-idle: 10
  #         min-idle: 5
  #         max-wait: 3000ms
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

# MinIO配置
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: aksu

# JWT配置
jwt:
  secret: aksu-supervision-jwt-secret-key-2024-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

# 百度OCR配置
baidu:
  ocr:
    app-id: ""
    api-key: ""
    secret-key: ""

# 微信小程序配置
wx:
  mini:
    appid: ""
    secret: ""

# SpringDoc配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: cn.aksu.supervision
  default-flat-param-object: true

logging:
  level:
    cn.aksu.supervision: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
