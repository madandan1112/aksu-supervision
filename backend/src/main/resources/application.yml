server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    max-http-form-post-size: 200MB
    max-swallow-size: 200MB

spring:
  application:
    name: aksu-supervision-backend
  datasource:
    # 凭据支持环境变量覆盖（DB_USERNAME/DB_PASSWORD），默认值仅用于本地开发环境
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13306/aksu_supervision?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Majunqiu110@}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  # Redis disabled for now
  # data:
  #   redis:
  #     host: localhost
  #     port: 6379
  #     database: 0
  #     timeout: 5000ms
  #     lettuce:
  #       pool:
  #         max-active: 20
  #         max-idle: 10
  #         min-idle: 5
  #         max-wait: 3000ms
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

# MinIO配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: aksu

# JWT配置（生产环境必须通过 JWT_SECRET 环境变量覆盖）
jwt:
  secret: ${JWT_SECRET:aksu-supervision-jwt-secret-key-2024-must-be-at-least-256-bits-long-for-hs256}
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

# 验证码日志明文开关：开发环境true（供自动化测试取码），生产环境必须false
captcha:
  log-code-enabled: ${CAPTCHA_LOG_CODE:true}

# 百度OCR配置（未配置密钥时自动降级为手动录入）
baidu:
  ocr:
    app-id: ${BAIDU_OCR_APP_ID:}
    api-key: ${BAIDU_OCR_API_KEY:}
    secret-key: ${BAIDU_OCR_SECRET_KEY:}

# 微信小程序配置（appid/secret 到位后 wx-login 与订阅消息自动启用）
wx:
  mini:
    appid: ${WX_MINI_APPID:}
    secret: ${WX_MINI_SECRET:}
    # 订阅消息模板ID（整改通知/预警督办），留空则只发站内信
    template-rectify: ${WX_TPL_RECTIFY:}
    template-alert: ${WX_TPL_ALERT:}

# SpringDoc配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: cn.aksu.supervision
  default-flat-param-object: true

logging:
  level:
    cn.aksu.supervision: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
